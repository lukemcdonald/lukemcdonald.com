name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm build

  audit:
    name: Code health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Audit new issues vs PR base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          pnpm exec fallow audit --base "origin/${{ github.base_ref }}"

  e2e:
    env:
      E2E_BROWSERS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'full' || 'pr' }}
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ env.E2E_BROWSERS }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.E2E_BROWSERS }}-
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        run: |
          if [ "${E2E_BROWSERS}" = "full" ]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
