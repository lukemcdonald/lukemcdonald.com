name: End-to-end tests

on:
  workflow_call:
    inputs:
      browsers:
        default: pr
        description: Browser set. pr is Chromium and Pixel 5; full adds Firefox and WebKit.
        type: string
      playwright-version:
        default: '1.64.1'
        description: '@playwright/test version. Must match pnpm-lock.yaml and the container tag.'
        type: string
  workflow_dispatch:
    inputs:
      browsers:
        default: pr
        description: Browser set. pr is Chromium and Pixel 5; full adds Firefox and WebKit.
        options:
          - full
          - pr
        type: choice
      playwright-version:
        default: '1.64.1'
        description: '@playwright/test version. Must match pnpm-lock.yaml and the container tag.'
        type: string

concurrency:
  cancel-in-progress: true
  group: e2e-${{ github.event_name }}-${{ github.ref }}

jobs:
  e2e:
    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright-version }}-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      E2E_BROWSERS: ${{ inputs.browsers }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Check Playwright version
        run: |
          set -euo pipefail
          installed="$(node -p "require('@playwright/test/package.json').version")"
          expected="${{ inputs.playwright-version }}"
          if [[ "${installed}" != "${expected}" ]]; then
            echo "Installed @playwright/test ${installed} does not match mcr.microsoft.com/playwright:v${expected}-noble."
            echo "Update the playwright-version input default in .github/workflows/e2e.yml to ${installed}."
            exit 1
          fi
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        name: Surface flaky tests
        run: |
          set -euo pipefail
          summary() {
            echo '## Flaky tests'
            echo
            if [[ ! -f test-results/results.json ]]; then
              echo 'No Playwright JSON report found.'
              return 0
            fi
            if ! flakes="$(
              node -e '
                const report = JSON.parse(
                  require("node:fs").readFileSync("test-results/results.json", "utf8")
                );
                const flakes = [];
                const visit = (suite) => {
                  for (const spec of suite.specs ?? []) {
                    if (spec.tests?.some((test) => test.status === "flaky")) {
                      flakes.push(`- ${spec.file}: ${spec.title}`);
                    }
                  }
                  for (const child of suite.suites ?? []) {
                    visit(child);
                  }
                };
                for (const suite of report.suites ?? []) {
                  visit(suite);
                }
                if (flakes.length === 0) {
                  process.stdout.write("None. Every test passed on the first try.\n");
                  process.exit(0);
                }
                process.stdout.write(`${flakes.join("\n")}\n`);
              '
            )"; then
              echo 'Could not parse Playwright JSON report.'
              return 0
            fi
            printf '%s\n' "${flakes}"
          }
          summary | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
