name: End-to-end tests

on:
  workflow_call:
    inputs:
      browsers:
        default: pr
        description: Browser set. pr is Chromium and Pixel 5; full adds Firefox and WebKit.
        type: string
  workflow_dispatch:
    inputs:
      browsers:
        default: pr
        description: Browser set. pr is Chromium and Pixel 5; full adds Firefox and WebKit.
        options:
          - full
          - pr
        type: choice

concurrency:
  cancel-in-progress: true
  group: e2e-${{ github.event_name }}-${{ github.ref }}

jobs:
  playwright-version:
    name: Playwright version
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: lockfile
        name: Read @playwright/test from lockfile
        run: |
          set -euo pipefail
          version="$(grep -A2 "^      '@playwright/test':$" pnpm-lock.yaml | awk '/version:/ { sub(/\(.*/, "", $2); print $2; exit }')"
          if [[ -z "${version}" ]]; then
            echo 'Could not find @playwright/test in pnpm-lock.yaml.'
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  e2e:
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      E2E_BROWSERS: ${{ inputs.browsers }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    name: Playwright
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        name: Surface flaky tests
        run: |
          set -euo pipefail
          summary() {
            echo '## Flaky tests'
            echo
            if [[ ! -f test-results/results.json ]]; then
              echo 'No Playwright JSON report found.'
              return 0
            fi
            if ! flakes="$(
              node -e '
                const report = JSON.parse(
                  require("node:fs").readFileSync("test-results/results.json", "utf8")
                );
                const flakes = [];
                const visit = (suite) => {
                  for (const spec of suite.specs ?? []) {
                    if (spec.tests?.some((test) => test.status === "flaky")) {
                      flakes.push(`- ${spec.file}: ${spec.title}`);
                    }
                  }
                  for (const child of suite.suites ?? []) {
                    visit(child);
                  }
                };
                for (const suite of report.suites ?? []) {
                  visit(suite);
                }
                if (flakes.length === 0) {
                  process.stdout.write("None. Every test passed on the first try.\n");
                  process.exit(0);
                }
                process.stdout.write(`${flakes.join("\n")}\n`);
              '
            )"; then
              echo 'Could not parse Playwright JSON report.'
              return 0
            fi
            printf '%s\n' "${flakes}"
          }
          summary | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
